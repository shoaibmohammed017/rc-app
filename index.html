<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PRC Sales App</title>
<link rel="stylesheet" href="styles.css?v=28" />
<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/png" href="icon-192.png?v=2" />
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PRC Sales App" />
<!-- Apply saved theme before paint (no flash) -->
<script>
  (function(){
    try{
      var t = localStorage.getItem("rcbiz_theme") || "system";
      var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if(dark) document.documentElement.classList.add("dark");
    }catch(e){}
  })();
</script>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="logo.png" alt="PRC" style="width:100%;height:100%;object-fit:cover;border-radius:12px" /></div>
      <div class="brand-text">
        <span class="brand-name" id="brandName">PRC Sales App</span>
        <span class="brand-sub">Business Tracker</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard"><span>📊</span> Dashboard</button>
      <button class="nav-item" data-view="sales"><span>💰</span> Sales</button>
      <button class="nav-item" data-view="purchases"><span>📦</span> Purchases</button>
      <button class="nav-item" data-view="expenses"><span>🧾</span> Expenses</button>
      <button class="nav-item" data-view="inventory"><span>🚗</span> Inventory</button>
      <button class="nav-item" data-view="customers"><span>👥</span> Customers</button>
      <button class="nav-item" data-view="suppliers"><span>🏭</span> Suppliers</button>
      <button class="nav-item" data-view="staff"><span>🧑‍🔧</span> Staff</button>
      <button class="nav-item" data-view="approvals"><span>✅</span> Approvals <i class="nav-badge" id="apprBadge"></i></button>
      <button class="nav-item" data-view="reports"><span>📈</span> Reports</button>
      <button class="nav-item" data-view="settings"><span>⚙️</span> Settings</button>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-primary btn-block" id="installBtn" style="display:none;margin-bottom:8px">⬇️ Install as app</button>
      <button class="btn btn-ghost btn-block" id="quickBackup">⬇️ Backup data</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <h1 id="viewTitle">Dashboard</h1>
      <div class="topbar-actions" id="topbarActions"></div>
      <div class="user-menu" id="userMenu"></div>
    </header>
    <div class="content" id="content"></div>
  </main>

  <!-- Bottom nav (mobile) -->
  <nav class="bottomnav" id="bottomNav">
    <div class="inner">
      <button class="bn-item nav-item active" data-view="dashboard"><span class="bn-ico">📊</span>Home<i class="bn-dot"></i></button>
      <button class="bn-item nav-item" data-view="sales"><span class="bn-ico">💰</span>Sales<i class="bn-dot"></i></button>
      <button class="bn-item nav-item" data-view="purchases"><span class="bn-ico">📦</span>Buy<i class="bn-dot"></i></button>
      <button class="bn-item nav-item" data-view="expenses"><span class="bn-ico">🧾</span>Spend<i class="bn-dot"></i></button>
      <button class="bn-item" id="moreBtn"><span class="bn-ico">⋯</span>More<i class="bn-dot"></i></button>
    </div>
  </nav>

  <!-- Quick-add FAB (mobile) -->
  <button class="fab" id="fab" aria-label="Quick add">＋</button>
</div>

<!-- Login screen -->
<div class="login-screen open" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="login-logo"><img src="logo.png" alt="PRC" style="width:100%;height:100%;object-fit:cover;border-radius:20px" /></div>
    <h2 id="loginTitle">PRC Sales App</h2>
    <p class="login-sub">Enter your PIN</p>
    <div class="field"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••" required></div>
    <div class="login-err" id="loginErr"></div>
    <button type="submit" class="btn btn-primary btn-block">Unlock →</button>
    <p class="login-hint" id="loginHint"></p>
  </form>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Title</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=28"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        // check for updates on each load
        reg.update();
        // when a new worker installs, tell it to take over immediately
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", () => {
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              nw.postMessage("SKIP_WAITING");
            }
          });
        });
      }).catch(() => {});
      // reload once when the new worker takes control, so the user sees the update
      let refreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshed) return;
        refreshed = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
